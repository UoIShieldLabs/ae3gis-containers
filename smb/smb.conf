[global]
  workgroup = WORKGROUP
  server string = Fileshare (Samba 4.5.9)
  security = user
  map to guest = Bad User
  log file = /var/log/samba/log.%m
  max log size = 50

# LAB-ONLY / DELIBERATELY INSECURE: a guest-writable share mapped (force user) onto
# the file-operator's HOME directory. This is the SMB misconfiguration the intruder
# abuses: writing an SSH public key into ftops' ~/.ssh/authorized_keys over this
# share grants a key login as ftops. Never expose a home directory this way.
[ftops]
  comment = File operations
  path = /home/ftops
  read only = no
  guest ok = yes
  force user = ftops
  create mask = 0644
  directory mask = 0755
