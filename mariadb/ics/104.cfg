# Staged IEC-104 attack config for the Industroyer case-study lab (LAB-ONLY).
#
# The real Industroyer 104 module required manual staging: the operator of the
# malware had to supply the target's addressing before launch. The teaching beat
# is that the attacker ALREADY KNEW the substation's addressing - which is why all
# the earlier reconnaissance mattered.
[target]
host            = 10.0.3.50
port            = 2404
common_address  = 47
status_ioa      = 11
command_ioa     = 12
current_ioa     = 13
voltage_ioa     = 14

# mode = single  -> one breaker-open command, then exit
# mode = range   -> enumerate the IOA range and SUSTAIN open commands (denial of
#                   control); the operator cannot hold the breaker closed.
mode            = range
ioa_range_start = 11
ioa_range_end   = 14
