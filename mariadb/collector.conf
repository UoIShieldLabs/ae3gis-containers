# OT telemetry collector — historian data-feed configuration
# Pulls IEC-104 measurements from the substation and writes them into the
# historian database. Managed by the OT integration team.
#
# LAB-ONLY / DELIBERATELY INSECURE: this file plants a reused OT service-account
# credential ("secret sprawl") for the Industroyer teaching scenario. Never ship
# a config like this — secrets belong in a vault, never world-readable on disk,
# and never reused across hosts.

[historian]
db_host = 127.0.0.1
db_name = telemetry
db_user = historian
db_pass = pass

[ot_poll]
# RTU / field device this collector reaches over the permitted OT data feed.
rtu_host = 10.0.3.50
rtu_port = 2404
common_address = 47

[ot_service_account]
# Shared OT engineering service account the collector uses to reach OT Linux
# hosts for maintenance. The same password is reused across the OT estate
# (engineering workstation, RTU host) — this is the credential-reuse weakness.
username = root
password = pass
hosts = 10.0.3.15, 10.0.3.50
